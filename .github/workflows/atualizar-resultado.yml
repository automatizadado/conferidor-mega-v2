name: Atualizar resultado Mega-Sena

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Buscar resultado
        shell: python
        run: |
          import json
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://loteriascaixa-api.herokuapp.com/api/megasena"

          def buscar(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=30) as resposta:
                  return json.loads(
                      resposta.read().decode("utf-8")
                  )

          print("Buscando ultimo concurso...")

          atual = buscar(BASE + "/latest")

          concurso = (
              atual.get("concurso")
              or atual.get("numero")
          )

          if not concurso:
              raise Exception(
                  "Numero do concurso atual nao encontrado."
              )

          concurso = int(concurso)

          dezenas = (
              atual.get("dezenas")
              or atual.get("listaDezenas")
              or []
          )

          dezenas = [
              str(numero).zfill(2)
              for numero in dezenas
          ]

          if len(dezenas) != 6:
              raise Exception(
                  f"Resultado invalido: {len(dezenas)} dezenas."
              )

          #
          # PRÓXIMO PRÊMIO
          #

          proximo_premio = (
              atual.get("valorEstimadoProximoConcurso")
              or atual.get("valorEstimadoProximo")
              or atual.get("proximoPremio")
          )

          #
          # ACUMULOU
          #

          if "acumulou" in atual:
              acumulou = atual.get("acumulou")

          elif "acumulado" in atual:
              acumulou = atual.get("acumulado")

          else:
              acumulou = None

          #
          # BUSCAR CONCURSO ANTERIOR
          #

          concurso_anterior = concurso - 1

          print(
              f"Buscando concurso anterior: {concurso_anterior}"
          )

          anterior = buscar(
              BASE + "/" + str(concurso_anterior)
          )

          #
          # A ESTIMATIVA DO CONCURSO ANTERIOR
          # É O PRÊMIO SORTEADO DO CONCURSO ATUAL
          #

          premio_sorteado = (
              anterior.get("valorEstimadoProximoConcurso")
              or anterior.get("valorEstimadoProximo")
              or anterior.get("proximoPremio")
          )

          if premio_sorteado is None:
              raise Exception(
                  "Nao foi possivel encontrar a estimativa "
                  "do concurso anterior."
              )

          resultado = {
              "concurso": concurso,
              "dezenas": dezenas,
              "acumulou": acumulou,
              "premioSorteado": premio_sorteado,
              "proximoPremio": proximo_premio,
              "concursoAnterior": concurso_anterior,
              "atualizadoEm": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          print("Resultado normalizado:")
          print(
              json.dumps(
                  resultado,
                  ensure_ascii=False,
                  indent=2
              )
          )

          with open(
              "resultado.json",
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

      - name: Salvar resultado
        run: |
          git config user.name "mega-sena-bot"
          git config user.email "actions@github.com"

          git add resultado.json

          if git diff --cached --quiet; then
            echo "Resultado nao mudou."
            exit 0
          fi

          git commit -m "Atualiza resultado da Mega-Sena"
          git push
