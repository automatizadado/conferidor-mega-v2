<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conferidor Premium Mega-Sena</title>

<style>

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    color: #E5E7EB;
    padding: 15px;
    display: flex;

.card {

    padding: 25px;
    border-radius: 20px;

    width: 100%;

}

h2 {

    text-align: center;

}

.campo {

}

label {
    display: block;
    font-size: .85em;

input {

    background: #1F2937;
    color: #FFF;

input:focus {
    border-color: #2ebd59;

}

.sorteados-container input {

    padding: 12px 2px;
    font-weight: 800;
    font-size: 1.1em;
    background: #111827;

}

button {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    font-size: .95em;
    margin-top: 12px;

    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:disabled {
    opacity: .65;
    cursor: wait;
}

.btn-api {
    background: linear-gradient(135deg,#0088ff,#0055ff);
    color: white;
}

.btn-check {
    background: linear-gradient(135deg,#2ebd59,#1b5e20);
    color: white;
}

.btn-manage {
    background: linear-gradient(135deg,#374151,#1F2937);
    color: white;
}

.btn-whatsapp {
    background: linear-gradient(135deg,#25d366,#128c7e);
    color: white;

}

.btn-foto {

    color: white;
    display: none;
}

#status {

    text-align: center;
    color: #9CA3AF;
    margin-bottom: 12px;
}

.ciclo-info {
    text-align: center;
    color: #9CA3AF;

    margin: -5px 0 12px;
}

.resultado {

}

.alerta-vitoria {
    color: #FFF;
    padding: 12px;

    margin-top: 15px;

    text-align: center;

}

.gerenciar {
    display: none;
    background: #0F1115;
    border: 1px solid #374151;
    border-radius: 12px;

}

.jogo-edit {
    border-bottom: 1px dashed #374151;

}

.jogo-edit:last-child {

}

/* ========================================================= */
/* PRINT DO WHATSAPP                                         */
/* ========================================================= */

.card.capturando {
    padding: 18px;
    border: none;
    background: #0F1115;
}

.card.capturando h2 {
    margin-bottom: 12px;
    font-size: 1.25em;
}

.card.capturando .input-group-row {
    margin-bottom: 8px;
    gap: 6px;
}

.card.capturando label {
    font-size: .68em;
    margin-bottom: 3px;
}

.card.capturando input:not(#s1):not(#s2):not(#s3):not(#s4):not(#s5):not(#s6) {
    padding: 10px 7px !important;

}

.card.capturando .sorteados-container {
    margin-bottom: 12px;
    gap: 6px;
}

.card.capturando .sorteados-container input {
    padding: 12px 0 !important;
    line-height: 1.2 !important;
    font-size: 1.1em !important;
    background: #1F2937 !important;

}

/* Elementos administrativos não aparecem na imagem */

.card.capturando .btn-api,
.card.capturando .btn-check,
.card.capturando .btn-manage,
.card.capturando .gerenciar,
.card.capturando .btn-whatsapp,
.card.capturando .btn-foto,
.card.capturando #status,
.card.capturando .ciclo-info {
    display: none !important;
}

/* Mobile */

@media (max-width: 480px) {

    body {
        padding: 6px;
    }

    .card {
        padding: 20px;
    }

    .input-group-row.topo {
        gap: 6px;
    }

    .input-group-row.topo label {
        font-size: .72em;
    }

    .input-group-row.topo input {
        padding: 11px 6px;

}

</style>
</head>

color:#F59E0B;
font-weight:bold

Números Sorteados

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const TOTAL_CICLO = 12;

const jogosOriginais = [

    {
        dono:"Victor",
        numeros:[1,6,14,17,24,57]
    },

    {
        dono:"Marcelo",
        numeros:[5,10,23,37,40,53]
    },

    {
        dono:"William",
        numeros:[17,23,36,37,45,53]
    },

    {
        dono:"Paulo",
        numeros:[5,10,27,37,40,58]
    },

    {
        dono:"Carlos",
        numeros:[11,19,25,33,45,46]
    },

    {
        dono:"Lau",
        numeros:[3,8,9,23,30,34]
    },

    {
        dono:"Neto",
        numeros:[4,6,16,32,38,50]
    },

    {
        dono:"Maycon",
        numeros:[5,10,17,22,33,38]
    }

];


let meusJogos = [];

let concursosCiclo = [];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        carregarJogos();

        carregarCiclo();

        atualizarRestantes();

        montarGerenciador();

    }
);


/* =========================================================
   JOGOS
========================================================= */

function carregarJogos() {

    const salvo =
        localStorage.getItem(
            "mega_jogos_v2"
        );

    if (salvo) {

        try {

            meusJogos =
                JSON.parse(
                    salvo
                );

        } catch {

            meusJogos =
                JSON.parse(
                    JSON.stringify(
                        jogosOriginais
                    )
                );

        }

    } else {

        meusJogos =
            JSON.parse(
                JSON.stringify(
                    jogosOriginais
                )
            );

    }

}


/* =========================================================
   CICLO
========================================================= */

function carregarCiclo() {

    try {

        concursosCiclo =
            JSON.parse(
                localStorage.getItem(
                    "mega_ciclo_v2"
                ) || "[]"
            );

        if (
            !Array.isArray(
                concursosCiclo
            )
        ) {

            concursosCiclo = [];

        }

    } catch {

        concursosCiclo = [];

    }

}


function registrarConcurso(numero) {

    numero =
        parseInt(
            numero
        );

    if (!numero) {
        return;
    }


    /*
    Não permite contar o mesmo
    concurso duas vezes.
    */

    if (
        concursosCiclo.includes(
            numero
        )
    ) {

        atualizarRestantes();

        return;

    }


    /*
    Não ultrapassa os
    12 concursos do ciclo.
    */

    if (
        concursosCiclo.length >=
        TOTAL_CICLO
    ) {

        return;

    }


    concursosCiclo.push(
        numero
    );


    concursosCiclo.sort(
        (a,b) => a-b
    );


    localStorage.setItem(
        "mega_ciclo_v2",
        JSON.stringify(
            concursosCiclo
        )
    );


    atualizarRestantes();

}


function atualizarRestantes() {

    const utilizados =
        concursosCiclo.length;


    const restantes =
        Math.max(
            0,
            TOTAL_CICLO -
            utilizados
        );


    document.getElementById(
        "restantes"
    ).value =
        restantes;


    const info =
        document.getElementById(
            "ciclo-info"
        );


    if (
        utilizados === 0
    ) {

        info.innerText =
            "Novo ciclo • 12 concursos restantes";

    }

    else if (
        restantes > 0
    ) {

        info.innerText =
            `${utilizados}/12 concursos registrados`;

    }

    else {

        info.innerText =
            "12/12 concursos registrados • ciclo concluído";

    }

}


/* =========================================================
   GERENCIADOR DE JOGOS
========================================================= */

function abrirGerenciador() {

    const box =
        document.getElementById(
            "gerenciar"
        );


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

    }

    else {

        montarGerenciador();

        box.style.display =
            "block";

    }

}


function montarGerenciador() {

    const box =
        document.getElementById(
            "gerenciar"
        );


    let html = `

        <div style="
        color:#2ebd59;
        font-weight:800;
        margin-bottom:5px;
        ">

        Jogos cadastrados

        </div>


        <div style="
        color:#9CA3AF;
        font-size:.75em;
        margin-bottom:8px;
        ">

        Digite exatamente 6 números entre 1 e 60.

        </div>

    `;


    meusJogos.forEach(
        (jogo,i) => {

            html += `

            <div class="jogo-edit">

            <div style="
            color:#60A5FA;
            font-weight:700;
            ">

            👤 ${jogo.dono}

            </div>


            <input
            id="edit-${i}"
            value="${
                jogo.numeros
                .map(
                    n =>
                    String(n)
                    .padStart(
                        2,
                        "0"
                    )
                )
                .join(" ")
            }"
            >


            <button
            class="btn-check"
            style="
            padding:9px;
            margin-top:7px;
            "
            onclick="salvarJogo(${i})">

            Salvar

            </button>

            </div>

            `;

        }
    );


    box.innerHTML =
        html;

}


function salvarJogo(index) {

    const texto =
        document.getElementById(
            "edit-" +
            index
        ).value;


    const numeros =
        texto
        .split(/[,\s;]+/)
        .filter(Boolean)
        .map(Number);


    if (
        !validarDezenas(
            numeros
        )
    ) {

        alert(
            "Informe exatamente 6 números únicos entre 1 e 60."
        );

        return;

    }


    numeros.sort(
        (a,b) =>
        a-b
    );


    meusJogos[index].numeros =
        numeros;


    localStorage.setItem(
        "mega_jogos_v2",
        JSON.stringify(
            meusJogos
        )
    );


    montarGerenciador();


    alert(
        `Jogo de ${meusJogos[index].dono} salvo!`
    );

}


/* =========================================================
   VALIDAÇÃO
========================================================= */

function validarDezenas(
    numeros
) {

    return (

        numeros.length === 6 &&

        new Set(
            numeros
        ).size === 6 &&

        numeros.every(
            n =>
            Number.isInteger(n) &&
            n >= 1 &&
            n <= 60
        )

    );

}


function getSorteados() {

    return [
        1,2,3,4,5,6
    ]

    .map(
        i =>
        parseInt(
            document.getElementById(
                "s" + i
            ).value
        )
    )

    .filter(
        Number.isFinite
    );

}


/* =========================================================
   FORMATAÇÃO
========================================================= */

function formatarValor(
    valor
) {

    const numero =
        Number(
            valor
        );


    if (
        !Number.isFinite(
            numero
        )
    ) {

        return "---";

    }


    return numero.toLocaleString(
        "pt-BR",
        {

            minimumFractionDigits:2,

            maximumFractionDigits:2

        }
    );

}


/* =========================================================
   BUSCA AUTOMÁTICA
========================================================= */

async function buscarResultado() {

    const status =
        document.getElementById(
            "status"
        );


    const botao =
        document.getElementById(
            "btn-buscar"
        );


    status.innerText =
        "Buscando resultado atualizado...";


    status.style.color =
        "#F59E0B";


    botao.disabled =
        true;


    try {


        /*
        Busca exclusivamente o arquivo
        gerado pelo GitHub Actions.

        O parâmetro ?t evita cache antigo.
        */

        const response =
            await fetch(

                "./resultado.json?t=" +
                Date.now(),

                {
                    cache:
                    "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /* ===========================
           CONCURSO
        =========================== */

        const concurso =
            Number(
                data.concurso
            );


        if (
            !Number.isInteger(
                concurso
            ) ||
            concurso <= 0
        ) {

            throw new Error(
                "Concurso inválido."
            );

        }


        /* ===========================
           DATA
        =========================== */

        const dataSorteio =
            String(
                data.data || ""
            ).trim();


        if (
            !dataSorteio
        ) {

            throw new Error(
                "Data do sorteio não encontrada."
            );

        }


        /* ===========================
           DEZENAS
        =========================== */

        const dezenas =
            Array.isArray(
                data.dezenas
            )

            ?

            data.dezenas.map(
                Number
            )

            :

            [];


        if (
            !validarDezenas(
                dezenas
            )
        ) {

            throw new Error(
                "Resultado possui dezenas inválidas."
            );

        }


        /* ===========================
           ACUMULOU
        =========================== */

        const acumulado =
            data.acumulou === true ||
            String(
                data.acumulou
            ).toLowerCase() ===
            "true";


        /* ===========================
           PRÊMIOS
        =========================== */

        const premioSorteado =
            Number(
                data.premioSorteado
            );


        const proximoPremio =
            Number(
                data.proximoPremio
            );


        /* ===========================
           OBJETO INTERNO
        =========================== */

        const resultado = {

            numero:
                concurso,

            data:
                dataSorteio,

            dezenas:
                dezenas,

            acumulado:
                acumulado,

            premio:
                Number.isFinite(
                    premioSorteado
                )
                ?
                premioSorteado
                :
                0,

            proximo:
                Number.isFinite(
                    proximoPremio
                )
                ?
                proximoPremio
                :
                0

        };


        preencherResultado(
            resultado
        );


        status.innerText =
            `Sorteio ${concurso} atualizado com sucesso!`;


        status.style.color =
            "#2ebd59";


    }

    catch(error) {


        console.error(
            "Erro na busca automática:",
            error
        );


        status.innerText =
            "Não foi possível carregar o resultado.";


        status.style.color =
            "#EF4444";


    }

    finally {


        botao.disabled =
            false;


    }

}


/* =========================================================
   PREENCHER RESULTADO
========================================================= */

function preencherResultado(
    resultado
) {


    document.getElementById(
        "concurso"
    ).value =
        resultado.numero;


    document.getElementById(
        "data-sorteio"
    ).value =
        resultado.data || "---";


    const acumulou =
        document.getElementById(
            "acumulou"
        );


    acumulou.value =
        resultado.acumulado
        ?
        "SIM! 🚀"
        :
        "NÃO 🎯";


    acumulou.style.color =
        resultado.acumulado
        ?
        "#34D399"
        :
        "#60A5FA";


    resultado.dezenas.forEach(
        (numero,index) => {


            document.getElementById(
                "s" +
                (index + 1)
            ).value =
                numero;


        }
    );


    document.getElementById(
        "premio"
    ).value =

        resultado.premio

        ?

        formatarValor(
            resultado.premio
        )

        :

        "---";


    document.getElementById(
        "proximo-premio"
    ).value =

        resultado.proximo

        ?

        formatarValor(
            resultado.proximo
        )

        :

        "---";

}


/* =========================================================
   CONFERÊNCIA
========================================================= */

function conferir() {


    const sorteados =
        getSorteados();


    if (
        !validarDezenas(
            sorteados
        )
    ) {


        alert(
            "Carregue um resultado válido primeiro."
        );


        return;

    }


    const concurso =
        document.getElementById(
            "concurso"
        ).value;


    if (
        concurso
    ) {


        registrarConcurso(
            concurso
        );


    }


    const lista =
        document.getElementById(
            "lista-acertos"
        );


    lista.style.display =
        "grid";


    lista.style.gridTemplateColumns =
        "1fr 1fr";


    lista.style.gap =
        "10px";


    let html =
        "";


    let maxAcertos =
        0;


    meusJogos.forEach(
        jogoObj => {


            let acertos =
                0;


            const jogoHtml =
                jogoObj.numeros

                .map(
                    numero => {


                        const formatado =
                            numero
                            .toString()
                            .padStart(
                                2,
                                "0"
                            );


                        if (
                            sorteados.includes(
                                numero
                            )
                        ) {


                            acertos++;


                            return `

                            <span style="
                            display:inline-block;
                            background:linear-gradient(145deg,#34D399,#10B981);
                            color:#000;
                            padding:2px 5px;
                            border-radius:5px;
                            font-weight:900;
                            margin:0 1px;
                            box-shadow:0 2px 4px rgba(0,0,0,.3);
                            ">

                            ${formatado}

                            </span>

                            `;


                        }


                        return `

                        <span style="
                        display:inline-block;
                        background:#374151;
                        color:#E5E7EB;
                        padding:2px 5px;
                        border-radius:5px;
                        font-weight:700;
                        margin:0 1px;
                        ">

                        ${formatado}

                        </span>

                        `;


                    }
                )

                .join("");


            maxAcertos =
                Math.max(
                    maxAcertos,
                    acertos
                );


            let faixa =
                "";


            if (
                acertos === 4
            ) {

                faixa =
                    "🏅 QUADRA";

            }


            if (
                acertos === 5
            ) {

                faixa =
                    "🔥 QUINA";

            }


            if (
                acertos === 6
            ) {

                faixa =
                    "👑 SENA";

            }


            html += `

            <div style="
            background:#181C25;
            padding:12px 8px;
            border-radius:10px;
            border-top:4px solid ${acertos >= 4 ? "#10B981" : "#374151"};
            box-shadow:0 4px 6px rgba(0,0,0,.25);
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            ">


            <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px dashed #374151;
            padding-bottom:8px;
            margin-bottom:10px;
            ">


            <span style="
            font-size:.9em;
            color:#60A5FA;
            font-weight:700;
            white-space:nowrap;
            ">

            👤 ${jogoObj.dono}

            </span>


            <span style="
            font-size:.85em;
            color:${acertos >= 4 ? "#34D399" : "#9CA3AF"};
            font-weight:700;
            ">

            🎯 ${acertos} acertos

            </span>


            </div>


            <div style="
            font-size:1.05em;
            text-align:center;
            white-space:nowrap;
            ">

            ${jogoHtml}

            </div>


            ${
                faixa
                ?
                `

                <div style="
                margin-top:10px;
                text-align:center;
                font-size:.85em;
                background:linear-gradient(135deg,#10B981,#047857);
                color:#fff;
                font-weight:800;
                border-radius:4px;
                padding:4px;
                ">

                ${faixa}

                </div>

                `
                :
                ""
            }


            </div>

            `;


        }
    );


    lista.innerHTML =
        html;


    document.getElementById(
        "resultado-box"
    ).style.display =
        "block";


    document.getElementById(
        "btn-wa"
    ).style.display =
        "block";


    document.getElementById(
        "btn-foto"
    ).style.display =
        "block";


    const alerta =
        document.getElementById(
            "alerta"
        );


    if (
        maxAcertos >= 4
    ) {


        if (
            maxAcertos === 6
        ) {


            alerta.innerHTML =
                "👑 ACERTAMOS AS SEIS DEZENAS! 🤑 👑";


            alerta.style.background =
                "linear-gradient(135deg,#D97706,#92400E)";


        }


        else if (
            maxAcertos === 5
        ) {


            alerta.innerHTML =
                "🔥 ACERTAMOS A QUINA! 🤑 🔥";


            alerta.style.background =
                "linear-gradient(135deg,#064E3B,#047857)";


        }


        else {


            alerta.innerHTML =
                "🏅 ACERTAMOS A QUADRA! 🤑 🏅";


            alerta.style.background =
                "linear-gradient(135deg,#064E3B,#047857)";


        }


        alerta.style.display =
            "block";


    }


    else {


        alerta.style.display =
            "none";


    }

}


/* =========================================================
   WHATSAPP TEXTO
========================================================= */

function copiarWhatsApp() {


    const sorteados =
        getSorteados();


    if (
        !validarDezenas(
            sorteados
        )
    ) {


        alert(
            "Não há resultado completo para copiar!"
        );


        return;

    }


    const concurso =
        document.getElementById(
            "concurso"
        ).value || "---";


    const data =
        document.getElementById(
            "data-sorteio"
        ).value || "---";


    const premio =
        document.getElementById(
            "premio"
        ).value || "---";


    const proximo =
        document.getElementById(
            "proximo-premio"
        ).value || "---";


    const acumulou =
        document.getElementById(
            "acumulou"
        ).value || "---";


    const restantes =
        document.getElementById(
            "restantes"
        ).value;


    let texto =

`🍀 *RESUMO MEGA-SENA*

🔢 *Concurso:* ${concurso}
📅 *Data:* ${data}
💰 *Prêmio Concurso:* R$ ${premio}
🚀 *Acumulou:* ${acumulou}
🔮 *Próximo Prêmio:* R$ ${proximo}
✨ *Resultado:* ${sorteados.map(n => n.toString().padStart(2,"0")).join(" ")}

--------------------------
`;


    meusJogos.forEach(
        jogo => {


            const acertos =
                jogo.numeros.filter(
                    n =>
                    sorteados.includes(
                        n
                    )
                ).length;


            const numeros =
                jogo.numeros

                .map(
                    n => {


                        const f =
                            n
                            .toString()
                            .padStart(
                                2,
                                "0"
                            );


                        return sorteados.includes(
                            n
                        )
                        ?
                        `*${f}*`
                        :
                        f;


                    }
                )

                .join("  ");


            texto +=

`👤 *${jogo.dono}*
🎲 ${numeros}`;


            if (
                acertos > 0
            ) {


                texto +=

`  -> *${acertos} ${acertos === 1 ? "acerto" : "acertos"}*`;


            }


            texto +=
                "\n\n";


        }
    );


    texto +=

`--------------------------
⏳ *Sorteios restantes:* ${restantes}`;


    navigator.clipboard

        .writeText(
            texto
        )

        .then(
            () =>

            alert(
                "Resumo copiado para o WhatsApp!"
            )
        )

        .catch(
            () =>

            alert(
                "Erro ao copiar."
            )
        );

}


/* =========================================================
   IMAGEM
========================================================= */

async function gerarFotoResultado() {


    const card =
        document.querySelector(
            ".card"
        );


    const botao =
        document.getElementById(
            "btn-foto"
        );


    botao.innerText =
        "Gerando Imagem... ⌛";


    card.classList.add(
        "capturando"
    );


    await new Promise(
        resolve =>
        setTimeout(
            resolve,
            150
        )
    );


    try {


        const canvas =
            await html2canvas(
                card,
                {

                    scale:2,

                    backgroundColor:
                        "#0F1115",

                    useCORS:true

                }
            );


        const concurso =
            document.getElementById(
                "concurso"
            ).value || "Mega";


        const link =
            document.createElement(
                "a"
            );


        link.download =
            `Resultado_Mega_${concurso}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();


    }


    catch(error) {


        console.error(
            error
        );


        alert(
            "Não foi possível gerar a imagem."
        );


    }


    finally {


        card.classList.remove(
            "capturando"
        );


        botao.innerText =
            "Salvar Imagem do Resultado 📸";


    }

}

</script>
