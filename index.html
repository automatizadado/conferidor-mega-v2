body {

    display: none;

    color: #9CA3AF;

.jogo-numeros {

    letter-spacing: 2px;
    background: #1F2937;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
}


/* =========================================================
   PRINT / IMAGEM DO WHATSAPP
========================================================= */

.card.capturando {
    padding: 18px;
    border: none;
    background: #0F1115;
}

.card.capturando h2 {
    margin-bottom: 12px;
    font-size: 1.25em;
}

.card.capturando .input-group-row {
    margin-bottom: 8px;
    gap: 6px;
}

.card.capturando label {
    font-size: .68em;
    margin-bottom: 3px;
}

.card.capturando input:not(#s1):not(#s2):not(#s3):not(#s4):not(#s5):not(#s6) {
    padding: 10px 7px !important;

    line-height: 1.4 !important;
}

.card.capturando .sorteados-container {

    gap: 6px;
}

.card.capturando .sorteados-container input {
    padding: 12px 0 !important;
    line-height: 1.2 !important;
    font-size: 1.1em !important;
    background: #1F2937 !important;

}

}

}

/*
Elementos administrativos não aparecem
na imagem compartilhada.
*/

.card.capturando .btn-api,
.card.capturando .btn-check,
.card.capturando .btn-manage,
.card.capturando .gerenciar,
.card.capturando .btn-whatsapp,
.card.capturando .btn-foto,
.card.capturando #status,
.card.capturando .ciclo-info {

}


@media (max-width:480px) {

    body {
        padding:6px;
    }

    .card {
        padding:20px;

    .input-group-row.topo {
        gap:6px;
    }

    .input-group-row.topo label {
        font-size:.72em;
    }

    .input-group-row.topo input {

Carregando dados...

class="ciclo-info"

<div class="input-group-row topo">

font-weight:bold;
text-align:center;
">

class="btn-api"
id="btn-buscar"
onclick="carregarTudo()">

🔄 Buscar Resultado

</button>


<!-- =====================================================

===================================================== -->

<div
class="input-group-row"
style="margin-top:18px">

<div style="flex:1">

<label>
Prêmio Sorteado (R$)
</label>

Números Sorteados

<script>

/* =========================================================
   ESTADO DO SITE
========================================================= */

let meusJogos = [];

let dadosCiclo = null;

let resultadoAtual = null;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await carregarTudo();

    }
);


/* =========================================================
   BUSCAR JSON SEM CACHE
========================================================= */

async function buscarJSON(
    arquivo
) {

    const separador =
        arquivo.includes("?")
        ?
        "&"
        :
        "?";

    const response =
        await fetch(
            arquivo
            + separador
            + "t="
            + Date.now(),
            {
                cache:"no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            `Erro ao carregar ${arquivo}: HTTP ${response.status}`
        );

    }

    return await response.json();

}


/* =========================================================
   CARREGAR RESULTADO + CICLO
========================================================= */

async function carregarTudo() {

    const status =
        document.getElementById(
            "status"
        );

    const botao =
        document.getElementById(
            "btn-buscar"
        );

    status.innerText =
        "Buscando resultado e ciclo...";

    status.style.color =
        "#F59E0B";

    botao.disabled =
        true;


    try {

        /*
        Carregamos os dois arquivos diretamente
        do GitHub Pages.
        */

        const [
            resultado,
            ciclo
        ] = await Promise.all([

            buscarJSON(
                "./resultado.json"
            ),

            buscarJSON(
                "./ciclo.json"
            )

        ]);


        validarResultado(
            resultado
        );

        validarCiclo(
            ciclo
        );


        dadosCiclo =
            ciclo;


        meusJogos =
            ciclo.jogos.map(
                jogo => ({
                    dono:
                        jogo.dono,

                    numeros:
                        jogo.numeros
                        .map(Number)
                        .sort(
                            (a,b) => a-b
                        )
                })
            );


        resultadoAtual = {
            numero:
                Number(
                    resultado.concurso
                ),

            data:
                resultado.data || "---",

            dezenas:
                resultado.dezenas
                .map(Number)
                .sort(
                    (a,b) => a-b
                ),

            acumulado:
                resultado.acumulou === true
                ||
                String(
                    resultado.acumulou
                ).toLowerCase()
                === "true",

            premio:
                Number(
                    resultado.premioSorteado
                ) || 0,

            proximo:
                Number(
                    resultado.proximoPremio
                ) || 0
        };


        preencherResultado(
            resultadoAtual
        );


        atualizarInformacoesCiclo();


        montarGerenciador();


        /*
        Verifica se o concurso exibido já
        pertence ao histórico oficial.
        */

        const processado =
            concursoJaProcessado(
                resultadoAtual.numero
            );


        if (processado) {

            status.innerText =
                `Sorteio ${resultadoAtual.numero} processado e registrado no ciclo!`;

        }

        else {

            const inicioPlanejado =
                Number(
                    dadosCiclo
                    .concursoInicialPlanejado
                );

            if (
                inicioPlanejado
                &&
                resultadoAtual.numero
                <
                inicioPlanejado
            ) {

                status.innerText =
                    `Sorteio ${resultadoAtual.numero} atualizado • ciclo começa no ${inicioPlanejado}`;

            }

            else {

                status.innerText =
                    `Sorteio ${resultadoAtual.numero} atualizado • aguardando processamento do ciclo`;

            }

        }


        status.style.color =
            "#2ebd59";


    }

    catch(error) {

        console.error(
            error
        );

        status.innerText =
            "Não foi possível carregar os dados.";

        status.style.color =
            "#EF4444";

    }

    finally {

        botao.disabled =
            false;

    }

}


/* =========================================================
   VALIDAR RESULTADO.JSON
========================================================= */

function validarResultado(
    resultado
) {

    const concurso =
        Number(
            resultado.concurso
        );

    if (
        !Number.isInteger(
            concurso
        )
        ||
        concurso <= 0
    ) {

        throw new Error(
            "Concurso inválido em resultado.json"
        );

    }


    const dezenas =
        Array.isArray(
            resultado.dezenas
        )
        ?
        resultado.dezenas.map(
            Number
        )
        :
        [];


    if (
        !validarDezenas(
            dezenas
        )
    ) {

        throw new Error(
            "Dezenas inválidas em resultado.json"
        );

    }

}


/* =========================================================
   VALIDAR CICLO.JSON
========================================================= */

function validarCiclo(
    ciclo
) {

    if (
        !ciclo
        ||
        typeof ciclo !== "object"
    ) {

        throw new Error(
            "ciclo.json inválido"
        );

    }


    if (
        !Array.isArray(
            ciclo.jogos
        )
        ||
        ciclo.jogos.length === 0
    ) {

        throw new Error(
            "Nenhum jogo encontrado no ciclo.json"
        );

    }


    ciclo.jogos.forEach(
        jogo => {

            const numeros =
                Array.isArray(
                    jogo.numeros
                )
                ?
                jogo.numeros.map(
                    Number
                )
                :
                [];


            if (
                !jogo.dono
                ||
                !validarDezenas(
                    numeros
                )
            ) {

                throw new Error(
                    "Existe um jogo inválido no ciclo.json"
                );

            }

        }
    );

}


/* =========================================================
   VALIDAR DEZENAS
========================================================= */

function validarDezenas(
    numeros
) {

    return (

        numeros.length === 6

        &&

        new Set(
            numeros
        ).size === 6

        &&

        numeros.every(
            numero =>
                Number.isInteger(
                    numero
                )
                &&
                numero >= 1
                &&
                numero <= 60
        )

    );

}


/* =========================================================
   INFORMAÇÕES DO CICLO
========================================================= */

function atualizarInformacoesCiclo() {

    if (!dadosCiclo) {
        return;
    }


    const total =
        Number(
            dadosCiclo.totalConcursos
        ) || 12;


    const processados =
        Array.isArray(
            dadosCiclo.concursosProcessados
        )
        ?
        dadosCiclo.concursosProcessados.length
        :
        0;


    let restantes =
        Number(
            dadosCiclo.restantes
        );


    if (
        !Number.isFinite(
            restantes
        )
    ) {

        restantes =
            Math.max(
                0,
                total - processados
            );

    }


    document.getElementById(
        "restantes"
    ).value =
        restantes;


    const info =
        document.getElementById(
            "ciclo-info"
        );


    if (
        dadosCiclo.status ===
        "concluido"
    ) {

        info.innerText =
            `${total}/${total} concursos registrados • ciclo concluído`;

        return;

    }


    if (
        processados === 0
    ) {

        const inicio =
            dadosCiclo
            .concursoInicialPlanejado;

        info.innerText =
            inicio
            ?
            `Novo ciclo • inicia no concurso ${inicio} • ${restantes} restantes`
            :
            `Novo ciclo • ${restantes} concursos restantes`;

        return;

    }


    info.innerText =
        `${processados}/${total} concursos registrados`;

}


/* =========================================================
   VERIFICAR SE CONCURSO JÁ FOI PROCESSADO
========================================================= */

function concursoJaProcessado(
    concurso
) {

    if (
        !dadosCiclo
        ||
        !Array.isArray(
            dadosCiclo.concursosProcessados
        )
    ) {

        return false;

    }


    return dadosCiclo
        .concursosProcessados
        .map(Number)
        .includes(
            Number(
                concurso
            )
        );

}


/* =========================================================
   BUSCAR REGISTRO NO HISTÓRICO
========================================================= */

function buscarRegistroHistorico(
    concurso
) {

    if (
        !dadosCiclo
        ||
        !Array.isArray(
            dadosCiclo.historico
        )
    ) {

        return null;

    }


    return dadosCiclo
        .historico
        .find(
            item =>
                Number(
                    item.concurso
                )
                ===
                Number(
                    concurso
                )
        )
        || null;

}


/* =========================================================
   PREENCHER RESULTADO
========================================================= */

function preencherResultado(
    resultado
) {

    document.getElementById(
        "concurso"
    ).value =
        resultado.numero;


    document.getElementById(
        "data-sorteio"
    ).value =
        resultado.data || "---";


    const acumulou =
        document.getElementById(
            "acumulou"
        );


    acumulou.value =
        resultado.acumulado
        ?
        "SIM! 🚀"
        :
        "NÃO 🎯";


    acumulou.style.color =
        resultado.acumulado
        ?
        "#34D399"
        :
        "#60A5FA";


    resultado.dezenas.forEach(
        (numero,index) => {

            document.getElementById(
                "s" + (index + 1)
            ).value =
                numero;

        }
    );


    document.getElementById(
        "premio"
    ).value =
        resultado.premio
        ?
        formatarValor(
            resultado.premio
        )
        :
        "---";


    document.getElementById(
        "proximo-premio"
    ).value =
        resultado.proximo
        ?
        formatarValor(
            resultado.proximo
        )
        :
        "---";

}


/* =========================================================
   FORMATAR VALOR
========================================================= */

function formatarValor(
    valor
) {

    const numero =
        Number(
            valor
        );


    if (
        !Number.isFinite(
            numero
        )
    ) {

        return "---";

    }


    return numero.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   NÚMEROS SORTEADOS
========================================================= */

function getSorteados() {

    return [
        1,2,3,4,5,6
    ]

    .map(
        i =>
            parseInt(
                document.getElementById(
                    "s" + i
                ).value
            )
    )

    .filter(
        Number.isFinite
    );

}


/* =========================================================
   VISUALIZAR JOGOS DO CICLO
========================================================= */

function abrirGerenciador() {

    const box =
        document.getElementById(
            "gerenciar"
        );


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

    }

    else {

        montarGerenciador();

        box.style.display =
            "block";

    }

}


function montarGerenciador() {

    const box =
        document.getElementById(
            "gerenciar"
        );


    if (
        !meusJogos.length
    ) {

        box.innerHTML =
            "Nenhum jogo carregado.";

        return;

    }


    let html = `

        <div style="
        color:#2ebd59;
        font-weight:800;
        margin-bottom:5px;
        ">

        Jogos oficiais do ciclo

        </div>


        <div style="
        color:#9CA3AF;
        font-size:.75em;
        margin-bottom:8px;
        ">

        Estes números são carregados diretamente do ciclo.json.

        </div>

    `;


    meusJogos.forEach(
        jogo => {

            const numeros =
                jogo.numeros
                .map(
                    numero =>
                        String(
                            numero
                        ).padStart(
                            2,
                            "0"
                        )
                )
                .join(" ");


            html += `

                <div class="jogo-edit">

                    <div style="
                    color:#60A5FA;
                    font-weight:700;
                    ">

                    👤 ${jogo.dono}

                    </div>

                    <div class="jogo-numeros">

                    ${numeros}

                    </div>

                </div>

            `;

        }
    );


    box.innerHTML =
        html;

}


/* =========================================================
   CONFERIR JOGOS
========================================================= */

function conferir() {

    const sorteados =
        getSorteados();


    if (
        !validarDezenas(
            sorteados
        )
    ) {

        alert(
            "Não há um resultado válido carregado."
        );

        return;

    }


    if (
        !meusJogos.length
    ) {

        alert(
            "Os jogos do ciclo ainda não foram carregados."
        );

        return;

    }


    const concurso =
        Number(
            document.getElementById(
                "concurso"
            ).value
        );


    /*
    Se o concurso já foi processado pelo GitHub,
    procuramos o registro oficial do histórico.

    Caso ainda não tenha sido processado,
    fazemos apenas uma conferência visual.

    IMPORTANTE:
    esta função NÃO altera ciclo.json,
    NÃO reduz restantes
    e NÃO grava localStorage.
    */

    const registroOficial =
        buscarRegistroHistorico(
            concurso
        );


    const lista =
        document.getElementById(
            "lista-acertos"
        );


    lista.style.display =
        "grid";

    lista.style.gridTemplateColumns =
        "1fr 1fr";

    lista.style.gap =
        "10px";


    let html =
        "";

    let maxAcertos =
        0;


    meusJogos.forEach(
        jogoObj => {

            let acertos = 0;

            let dezenasAcertadas = [];


            /*
            Preferimos o resultado registrado
            pelo workflow quando existir.
            */

            if (
                registroOficial
                &&
                Array.isArray(
                    registroOficial.resultados
                )
            ) {

                const oficial =
                    registroOficial
                    .resultados
                    .find(
                        item =>
                            item.dono
                            ===
                            jogoObj.dono
                    );


                if (oficial) {

                    acertos =
                        Number(
                            oficial.acertos
                        ) || 0;

                    dezenasAcertadas =
                        Array.isArray(
                            oficial.dezenasAcertadas
                        )
                        ?
                        oficial
                        .dezenasAcertadas
                        .map(Number)
                        :
                        [];

                }

            }


            /*
            Se ainda não houver histórico oficial,
            calculamos localmente apenas para exibição.
            */

            if (!registroOficial) {

                dezenasAcertadas =
                    jogoObj.numeros.filter(
                        numero =>
                            sorteados.includes(
                                numero
                            )
                    );

                acertos =
                    dezenasAcertadas.length;

            }


            const jogoHtml =
                jogoObj.numeros

                .map(
                    numero => {

                        const formatado =
                            numero
                            .toString()
                            .padStart(
                                2,
                                "0"
                            );


                        if (
                            dezenasAcertadas.includes(
                                numero
                            )
                        ) {

                            return `

                            <span style="
                            display:inline-block;
                            background:linear-gradient(145deg,#34D399,#10B981);
                            color:#000;
                            padding:2px 5px;
                            border-radius:5px;
                            font-weight:900;
                            margin:0 1px;
                            box-shadow:0 2px 4px rgba(0,0,0,.3);
                            ">

                            ${formatado}

                            </span>

                            `;

                        }


                        return `

                        <span style="
                        display:inline-block;
                        background:#374151;
                        color:#E5E7EB;
                        padding:2px 5px;
                        border-radius:5px;
                        font-weight:700;
                        margin:0 1px;
                        ">

                        ${formatado}

                        </span>

                        `;

                    }
                )

                .join("");


            maxAcertos =
                Math.max(
                    maxAcertos,
                    acertos
                );


            let faixa =
                "";


            if (
                acertos === 4
            ) {

                faixa =
                    "🏅 QUADRA";

            }


            if (
                acertos === 5
            ) {

                faixa =
                    "🔥 QUINA";

            }


            if (
                acertos === 6
            ) {

                faixa =
                    "👑 SENA";

            }


            html += `

            <div style="
            background:#181C25;
            padding:12px 8px;
            border-radius:10px;
            border-top:4px solid ${acertos >= 4 ? "#10B981" : "#374151"};
            box-shadow:0 4px 6px rgba(0,0,0,.25);
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            ">


            <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px dashed #374151;
            padding-bottom:8px;
            margin-bottom:10px;
            ">


            <span style="
            font-size:.9em;
            color:#60A5FA;
            font-weight:700;
            white-space:nowrap;
            ">

            👤 ${jogoObj.dono}

            </span>


            <span style="
            font-size:.85em;
            color:${acertos >= 4 ? "#34D399" : "#9CA3AF"};
            font-weight:700;
            ">

            🎯 ${acertos} acertos

            </span>

            </div>


            <div style="
            font-size:1.05em;
            text-align:center;
            white-space:nowrap;
            ">

            ${jogoHtml}

            </div>


            ${
                faixa
                ?
                `

                <div style="
                margin-top:10px;
                text-align:center;
                font-size:.85em;
                background:linear-gradient(135deg,#10B981,#047857);
                color:#fff;
                font-weight:800;
                border-radius:4px;
                padding:4px;
                ">

                ${faixa}

                </div>

                `
                :
                ""
            }

            </div>

            `;

        }
    );


    lista.innerHTML =
        html;


    document.getElementById(
        "resultado-box"
    ).style.display =
        "block";


    document.getElementById(
        "btn-wa"
    ).style.display =
        "block";


    document.getElementById(
        "btn-foto"
    ).style.display =
        "block";


    const alerta =
        document.getElementById(
            "alerta"
        );


    if (
        maxAcertos >= 4
    ) {

        if (
            maxAcertos === 6
        ) {

            alerta.innerHTML =
                "👑 ACERTAMOS AS SEIS DEZENAS! 🤑 👑";

            alerta.style.background =
                "linear-gradient(135deg,#D97706,#92400E)";

        }

        else if (
            maxAcertos === 5
        ) {

            alerta.innerHTML =
                "🔥 ACERTAMOS A QUINA! 🤑 🔥";

            alerta.style.background =
                "linear-gradient(135deg,#064E3B,#047857)";

        }

        else {

            alerta.innerHTML =
                "🏅 ACERTAMOS A QUADRA! 🤑 🏅";

            alerta.style.background =
                "linear-gradient(135deg,#064E3B,#047857)";

        }


        alerta.style.display =
            "block";

    }

    else {

        alerta.style.display =
            "none";

    }

}


/* =========================================================
   COPIAR PARA WHATSAPP
========================================================= */

function copiarWhatsApp() {

    const sorteados =
        getSorteados();


    if (
        !validarDezenas(
            sorteados
        )
    ) {

        alert(
            "Não há resultado completo para copiar!"
        );

        return;

    }


    const concurso =
        document.getElementById(
            "concurso"
        ).value || "---";


    const data =
        document.getElementById(
            "data-sorteio"
        ).value || "---";


    const premio =
        document.getElementById(
            "premio"
        ).value || "---";


    const proximo =
        document.getElementById(
            "proximo-premio"
        ).value || "---";


    const acumulou =
        document.getElementById(
            "acumulou"
        ).value || "---";


    const restantes =
        document.getElementById(
            "restantes"
        ).value;


    let texto =

`🍀 *RESUMO MEGA-SENA*

🔢 *Concurso:* ${concurso}
📅 *Data:* ${data}
💰 *Prêmio Concurso:* R$ ${premio}
🚀 *Acumulou:* ${acumulou}
🔮 *Próximo Prêmio:* R$ ${proximo}
✨ *Resultado:* ${sorteados.map(n => n.toString().padStart(2,"0")).join(" ")}

--------------------------
`;


    meusJogos.forEach(
        jogo => {

            const acertos =
                jogo.numeros.filter(
                    numero =>
                        sorteados.includes(
                            numero
                        )
                ).length;


            const numeros =
                jogo.numeros

                .map(
                    numero => {

                        const formatado =
                            numero
                            .toString()
                            .padStart(
                                2,
                                "0"
                            );

                        return sorteados.includes(
                            numero
                        )
                        ?
                        `*${formatado}*`
                        :
                        formatado;

                    }
                )

                .join("  ");


            texto +=
`👤 *${jogo.dono}*
🎲 ${numeros}`;


            if (
                acertos > 0
            ) {

                texto +=
`  -> *${acertos} ${acertos === 1 ? "acerto" : "acertos"}*`;

            }


            texto +=
                "\n\n";

        }
    );


    texto +=
`--------------------------
⏳ *Sorteios restantes:* ${restantes}`;


    navigator.clipboard
        .writeText(
            texto
        )
        .then(
            () =>
                alert(
                    "Resumo copiado para o WhatsApp!"
                )
        )
        .catch(
            () =>
                alert(
                    "Erro ao copiar."
                )
        );

}


/* =========================================================
   GERAR IMAGEM
========================================================= */

async function gerarFotoResultado() {

    const card =
        document.querySelector(
            ".card"
        );


    const botao =
        document.getElementById(
            "btn-foto"
        );


    botao.innerText =
        "Gerando Imagem... ⌛";


    card.classList.add(
        "capturando"
    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                150
            )
    );


    try {

        const canvas =
            await html2canvas(
                card,
                {
                    scale:2,
                    backgroundColor:"#0F1115",
                    useCORS:true
                }
            );


        const concurso =
            document.getElementById(
                "concurso"
            ).value || "Mega";


        const link =
            document.createElement(
                "a"
            );


        link.download =
            `Resultado_Mega_${concurso}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();

    }

    catch(error) {

        console.error(
            error
        );


        alert(
            "Não foi possível gerar a imagem."
        );

    }

    finally {

        card.classList.remove(
            "capturando"
        );


        botao.innerText =
            "Salvar Imagem do Resultado 📸";

    }

}

</script>
